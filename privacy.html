<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Política de Privacidad — Gossip Garden</title>
  <link rel="icon" type="image/png" href="assets/icons/icon-crayon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{background:#FAF1DA;color:#3D2817;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-family:'Quicksand',sans-serif}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
      background-image:url("data:image/svg+xml,%3Csvg width='320' height='320' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='4' stitchTiles='stitch' seed='5'/%3E%3CfeColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.38 0 0 0 0 0.18 0 0 0 0.18 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.22;
      background-image:url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='2' stitchTiles='stitch' seed='12'/%3E%3CfeColorMatrix values='0 0 0 0 0.78 0 0 0 0 0.55 0 0 0 0 0.25 0 0 0 0.4 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E")}
    h1,h2,h3,h4{text-shadow:.5px 0 0 currentColor,-.5px 0 0 currentColor,0 .4px 0 currentColor,0 -.4px 0 currentColor;letter-spacing:-.3px}
    a{color:inherit}
    @media(max-width:768px){.gg-nav-d{display:none!important}.gg-nav-m{display:block!important}}
    @media(min-width:769px){.gg-nav-m{display:none!important}}
    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:#FAF1DA}
    ::-webkit-scrollbar-thumb{background:#C68A40;border-radius:4px}
    #root>div{position:relative;z-index:2}
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script>document.addEventListener('dragstart', function(e){ if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });</script>
  <script type="text/babel" src="components/crayon-v3.jsx?v=20260624x"></script>
  <script type="text/babel" src="components/sections-v3.jsx?v=20260625k"></script>
  <script type="text/babel" src="components/legal.jsx?v=20260624x"></script>
  <script type="text/babel">
    const makeSections = (t) => [
      { id: 'responsable', title: L(t.lang,'Responsable del tratamiento','Data controller'), content: (<>
        <LP t={t}>{L(t.lang,'Gossip Garden ("Gossip Garden", "nosotros") es responsable del tratamiento de los datos personales que recopilamos a través de nuestro dispositivo (la "maceta inteligente"), la aplicación móvil, el sitio web y los servicios asociados (en conjunto, el "Servicio").','Gossip Garden ("Gossip Garden", "we") is responsible for processing the personal data we collect through our device (the "smart pot"), the mobile app, the website and associated services (together, the "Service").')}</LP>
        <LUL t={t} items={[
          L(t.lang,'Responsable: Gossip Garden.','Controller: Gossip Garden.'),
          L(t.lang,'Correo de contacto y privacidad: hola@gossipgarden.co.','Contact and privacy email: hola@gossipgarden.co.'),
          L(t.lang,'Ámbito: usuarios del kit IoT, de la app y visitantes del sitio web.','Scope: users of the IoT kit, the app and website visitors.'),
        ]}/>
        <LP t={t}>{L(t.lang,'Tratamos tus datos conforme a la normativa colombiana de protección de datos personales (Ley 1581 de 2012 y el Decreto 1377 de 2013) y, cuando aplique por la ubicación del usuario, a normativas equivalentes.','We process your data in accordance with Colombian personal-data protection law (Law 1581 of 2012 and Decree 1377 of 2013) and, where applicable based on the user\'s location, equivalent regulations.')}</LP>
      </>)},

      { id: 'datos', title: L(t.lang,'Qué datos recopilamos','What data we collect'), content: (<>
        <LSub t={t}>{L(t.lang,'Datos de cuenta','Account data')}</LSub>
        <LUL t={t} items={[
          L(t.lang,'Nombre, dirección de correo electrónico y contraseña (almacenada de forma cifrada).','Name, email address and password (stored encrypted).'),
          L(t.lang,'Datos de tu perfil de jardinero (foto opcional, nombre que muestras en la comunidad).','Your gardener-profile data (optional photo, the name you show in the community).'),
        ]}/>
        <LSub t={t}>{L(t.lang,'Datos de tus plantas y dispositivos','Your plants and devices data')}</LSub>
        <LUL t={t} items={[
          L(t.lang,'Identificador del dispositivo ESP32 y datos de vinculación (firmware, estado de conexión).','ESP32 device identifier and pairing data (firmware, connection status).'),
          L(t.lang,'Lecturas de los sensores: temperatura y humedad ambiente (DHT22), nivel de luz (GY-30/BH1750) y humedad del suelo (SEN0193).','Sensor readings: temperature and ambient humidity (DHT22), light level (GY-30/BH1750) and soil moisture (SEN0193).'),
          L(t.lang,'Datos que tú declaras: tipo de planta, nombre que le pones y la personalidad asignada (Alegre, Dormilona, Dramática o Exigente).','Data you provide: plant type, the name you give it and the assigned personality (Cheerful, Sleepy, Dramatic or Demanding).'),
        ]}/>
        <LSub t={t}>{L(t.lang,'Datos de interacción y comunidad','Interaction and community data')}</LSub>
        <LUL t={t} items={[
          L(t.lang,'Mensajes y conversaciones que intercambias con tu planta a través de la IA.','Messages and conversations you exchange with your plant through the AI.'),
          L(t.lang,'Publicaciones, comentarios, reacciones e imágenes que compartes en el blog/comunidad.','Posts, comments, reactions and images you share in the blog/community.'),
        ]}/>
        <LSub t={t}>{L(t.lang,'Datos técnicos','Technical data')}</LSub>
        <LUL t={t} items={[
          L(t.lang,'Dirección IP, tipo de dispositivo, sistema operativo y datos de uso de la app/web.','IP address, device type, operating system and app/web usage data.'),
          L(t.lang,'Registros (logs) técnicos necesarios para diagnosticar fallos y mantener la seguridad.','Technical logs needed to diagnose failures and maintain security.'),
        ]}/>
      </>)},

      { id: 'origen', title: L(t.lang,'Cómo y cuándo recopilamos los datos','How and when we collect data'), content: (<>
        <LP t={t}>{L(t.lang,'Recopilamos datos de tres formas:','We collect data in three ways:')}</LP>
        <LUL t={t} items={[
          L(t.lang,'Cuando los proporcionas directamente: al crear tu cuenta, configurar una planta o publicar en la comunidad.','When you provide it directly: by creating your account, setting up a plant or posting in the community.'),
          L(t.lang,'De forma automática desde el dispositivo: la maceta envía las lecturas de sus sensores a nuestro backend a través del protocolo MQTT (broker HiveMQ) de manera periódica mientras esté encendida y conectada.','Automatically from the device: the pot sends its sensor readings to our backend via the MQTT protocol (HiveMQ broker) periodically while it is on and connected.'),
          L(t.lang,'De forma automática desde la app y el sitio web: datos técnicos y de uso mediante tecnologías estándar (ver sección de cookies).','Automatically from the app and website: technical and usage data via standard technologies (see the cookies section).'),
        ]}/>
      </>)},

      { id: 'finalidades', title: L(t.lang,'Para qué usamos tus datos','What we use your data for'), content: (<>
        <LUL t={t} items={[
          L(t.lang,'Prestar el Servicio: vincular tu maceta, mostrar el estado de tu planta y enviarte alertas de cuidado (riego, luz, temperatura).','Provide the Service: pair your pot, show your plant\'s status and send you care alerts (watering, light, temperature).'),
          L(t.lang,'Generar la personalidad y las conversaciones: procesamos las lecturas de los sensores y el contexto de tu planta para que la IA redacte mensajes con el carácter elegido.','Generate the personality and conversations: we process the sensor readings and your plant\'s context so the AI can write messages in the chosen character.'),
          L(t.lang,'Operar la comunidad: publicar tu contenido, mostrar comentarios y reacciones.','Operate the community: publish your content, show comments and reactions.'),
          L(t.lang,'Mejorar el producto: analizar el uso de forma agregada para corregir errores y desarrollar nuevas funciones.','Improve the product: analyze usage in aggregate to fix bugs and develop new features.'),
          L(t.lang,'Soporte y comunicación: responder a tus solicitudes y enviarte avisos importantes sobre el Servicio.','Support and communication: respond to your requests and send you important notices about the Service.'),
          L(t.lang,'Seguridad y cumplimiento: prevenir fraude, abuso y cumplir obligaciones legales.','Security and compliance: prevent fraud and abuse and meet legal obligations.'),
        ]}/>
      </>)},

      { id: 'base', title: L(t.lang,'Legitimación y autorización','Legal basis and authorization'), content: (<>
        <LP t={t}>{L(t.lang,'Tratamos tus datos con base en:','We process your data based on:')}</LP>
        <LUL t={t} items={[
          L(t.lang,'La ejecución del contrato: lo necesario para que el kit, la app y la cuenta funcionen.','Performance of the contract: what is needed for the kit, app and account to work.'),
          L(t.lang,'Tu autorización: para finalidades específicas como la participación en la comunidad o comunicaciones promocionales, que puedes retirar en cualquier momento.','Your authorization: for specific purposes such as participating in the community or promotional communications, which you can withdraw at any time.'),
          L(t.lang,'Nuestro interés legítimo: en mejorar el producto y garantizar la seguridad, siempre de forma proporcional y respetando tus derechos.','Our legitimate interest: in improving the product and ensuring security, always proportionately and respecting your rights.'),
        ]}/>
      </>)},

      { id: 'ia', title: L(t.lang,'Datos y la IA de personalidad','Data and the personality AI'), content: (<>
        <LP t={t}>{L(t.lang,'El corazón de Gossip Garden es una IA que convierte las lecturas de tus sensores en mensajes con personalidad. Para ello:','At the heart of Gossip Garden is an AI that turns your sensor readings into messages with personality. To do so:')}</LP>
        <LUL t={t} items={[
          L(t.lang,'Procesamos los datos de los sensores y el contexto de la planta para generar el texto de cada conversación.','We process the sensor data and the plant\'s context to generate the text of each conversation.'),
          L(t.lang,'Podemos apoyarnos en proveedores de modelos de lenguaje para producir esos mensajes; en ese caso compartimos únicamente la información mínima necesaria y bajo acuerdos de confidencialidad y tratamiento de datos.','We may rely on language-model providers to produce those messages; in that case we share only the minimum necessary information and under confidentiality and data-processing agreements.'),
          L(t.lang,'No utilizamos el contenido de tus conversaciones privadas para entrenar modelos de terceros sin tu autorización.','We do not use the content of your private conversations to train third-party models without your authorization.'),
        ]}/>
        <LNote t={t} color={window.PALETTE.heart}>{L(t.lang,'Las conversaciones de tu planta son contenido generado por IA con fines de acompañamiento y cuidado. No constituyen asesoría agronómica, médica ni profesional.','Your plant\'s conversations are AI-generated content for companionship and care purposes. They do not constitute agronomic, medical or professional advice.')}</LNote>
      </>)},

      { id: 'conservacion', title: L(t.lang,'Cuánto tiempo conservamos los datos','How long we keep your data'), content: (<>
        <LUL t={t} items={[
          L(t.lang,'Lecturas de sensores (series temporales): se conservan durante 30 días y luego se eliminan o anonimizan automáticamente. Algunos resúmenes agregados pueden conservarse más tiempo de forma no identificable.','Sensor readings (time series): kept for 30 days and then automatically deleted or anonymized. Some aggregated summaries may be kept longer in non-identifiable form.'),
          L(t.lang,'Datos de cuenta y de la comunidad: mientras tu cuenta esté activa. Si la eliminas, los borramos o anonimizamos en un plazo razonable, salvo obligación legal de conservarlos.','Account and community data: while your account is active. If you delete it, we erase or anonymize the data within a reasonable period, unless there is a legal obligation to keep it.'),
          L(t.lang,'Registros técnicos: por el tiempo necesario para seguridad y diagnóstico.','Technical logs: for the time needed for security and diagnostics.'),
        ]}/>
      </>)},

      { id: 'comparticion', title: L(t.lang,'Con quién compartimos los datos','Who we share data with'), content: (<>
        <LP t={t}>{L(t.lang,'No vendemos tus datos personales. Solo los compartimos con:','We do not sell your personal data. We only share it with:')}</LP>
        <LUL t={t} items={[
          L(t.lang,'Proveedores de infraestructura: alojamiento del backend (FastAPI sobre contenedores), bases de datos (PostgreSQL para cuentas y comunidad; MongoDB para series de sensores) y el broker de mensajería MQTT (HiveMQ).','Infrastructure providers: backend hosting (FastAPI on containers), databases (PostgreSQL for accounts and community; MongoDB for sensor series) and the MQTT messaging broker (HiveMQ).'),
          L(t.lang,'Proveedores de IA: para generar las conversaciones, con la información mínima necesaria.','AI providers: to generate the conversations, with the minimum necessary information.'),
          L(t.lang,'Autoridades: cuando exista una obligación legal o un requerimiento válido.','Authorities: when there is a legal obligation or a valid request.'),
        ]}/>
        <LP t={t}>{L(t.lang,'Todos nuestros proveedores actúan como encargados del tratamiento bajo contrato y solo pueden usar los datos para prestarnos el servicio.','All our providers act as data processors under contract and may only use the data to provide the service to us.')}</LP>
      </>)},

      { id: 'transferencias', title: L(t.lang,'Transferencias internacionales','International transfers'), content: (<>
        <LP t={t}>{L(t.lang,'Algunos de nuestros proveedores pueden procesar datos en servidores ubicados fuera de tu país. Cuando esto ocurra, adoptamos las garantías adecuadas (cláusulas contractuales y medidas de seguridad equivalentes) para proteger tu información conforme a la normativa aplicable.','Some of our providers may process data on servers located outside your country. When this happens, we adopt appropriate safeguards (contractual clauses and equivalent security measures) to protect your information in accordance with applicable regulations.')}</LP>
      </>)},

      { id: 'seguridad', title: L(t.lang,'Seguridad de la información','Information security'), content: (<>
        <LP t={t}>{L(t.lang,'Aplicamos medidas técnicas y organizativas razonables para proteger tus datos, entre ellas:','We apply reasonable technical and organizational measures to protect your data, including:')}</LP>
        <LUL t={t} items={[
          L(t.lang,'Cifrado de las comunicaciones (TLS) entre el dispositivo, la app y el backend.','Encryption of communications (TLS) between the device, the app and the backend.'),
          L(t.lang,'Almacenamiento de contraseñas mediante funciones de hash.','Storage of passwords using hash functions.'),
          L(t.lang,'Controles de acceso por roles y segmentación de la base de datos.','Role-based access controls and database segmentation.'),
          L(t.lang,'Monitoreo y registros para detectar accesos no autorizados.','Monitoring and logs to detect unauthorized access.'),
        ]}/>
        <LP t={t}>{L(t.lang,'Ningún sistema es 100% infalible; en caso de un incidente de seguridad que te afecte, te notificaremos conforme a la ley.','No system is 100% foolproof; in the event of a security incident that affects you, we will notify you in accordance with the law.')}</LP>
      </>)},

      { id: 'derechos', title: L(t.lang,'Tus derechos','Your rights'), content: (<>
        <LP t={t}>{L(t.lang,'Como titular de los datos puedes ejercer en cualquier momento tus derechos a:','As the data subject, you may exercise your rights at any time to:')}</LP>
        <LUL t={t} items={[
          L(t.lang,'Conocer, actualizar y rectificar tus datos.','Access, update and rectify your data.'),
          L(t.lang,'Solicitar prueba de la autorización otorgada.','Request proof of the authorization granted.'),
          L(t.lang,'Ser informado sobre el uso que damos a tus datos.','Be informed about how we use your data.'),
          L(t.lang,'Revocar la autorización y/o solicitar la supresión cuando proceda.','Withdraw authorization and/or request deletion where appropriate.'),
          L(t.lang,'Solicitar una copia de tus datos (portabilidad), cuando sea técnicamente posible.','Request a copy of your data (portability), where technically possible.'),
          L(t.lang,'Presentar quejas ante la Superintendencia de Industria y Comercio (SIC).','File complaints with the Superintendence of Industry and Commerce (SIC).'),
        ]}/>
        <LP t={t}>{L(t.lang,'Para ejercerlos, escríbenos a hola@gossipgarden.co indicando tu solicitud. Responderemos en los plazos legales.','To exercise them, email us at hola@gossipgarden.co stating your request. We will respond within the legal time frames.')}</LP>
      </>)},

      { id: 'menores', title: L(t.lang,'Menores de edad','Minors'), content: (<>
        <LP t={t}>{L(t.lang,'El Servicio está dirigido a personas mayores de edad. No recopilamos de forma intencionada datos de menores sin la autorización de sus padres o tutores. Si detectamos que hemos recibido datos de un menor sin la debida autorización, los eliminaremos.','The Service is intended for adults. We do not knowingly collect data from minors without the authorization of their parents or guardians. If we detect that we have received data from a minor without proper authorization, we will delete it.')}</LP>
      </>)},

      { id: 'cookies', title: L(t.lang,'Cookies y tecnologías similares','Cookies and similar technologies'), content: (<>
        <LP t={t}>{L(t.lang,'El sitio web y la app pueden usar cookies y tecnologías de almacenamiento local para recordar tus preferencias, mantener tu sesión y entender el uso del Servicio de forma agregada. Puedes gestionar las cookies desde la configuración de tu navegador; deshabilitarlas puede afectar algunas funciones.','The website and app may use cookies and local-storage technologies to remember your preferences, keep your session and understand use of the Service in aggregate. You can manage cookies from your browser settings; disabling them may affect some features.')}</LP>
        <LP t={t}>{L(t.lang,'En la comunidad, por ejemplo, usamos almacenamiento local para recordar las publicaciones a las que ya diste "me gusta".','In the community, for example, we use local storage to remember the posts you have already liked.')}</LP>
      </>)},

      { id: 'cambios', title: L(t.lang,'Cambios en esta política','Changes to this policy'), content: (<>
        <LP t={t}>{L(t.lang,'Podemos actualizar esta Política de Privacidad para reflejar cambios en el Servicio o en la normativa. Publicaremos la versión vigente en esta página con su fecha de actualización y, si los cambios son relevantes, te avisaremos por los canales habituales.','We may update this Privacy Policy to reflect changes in the Service or in regulations. We will publish the current version on this page with its update date and, if the changes are significant, we will let you know through the usual channels.')}</LP>
      </>)},

      { id: 'contacto', title: L(t.lang,'Contacto','Contact'), content: (<>
        <LP t={t}>{L(t.lang,'Si tienes preguntas sobre esta política o sobre el tratamiento de tus datos, contáctanos en hola@gossipgarden.co. Atenderemos tu solicitud lo antes posible.','If you have questions about this policy or about how your data is processed, contact us at hola@gossipgarden.co. We will handle your request as soon as possible.')}</LP>
      </>)},
    ];

    const App = () => {
      const lang = useLang();
      const t = { hf: 'Quicksand', bf: 'Nunito', lang };
      return (
      <LegalPage t={t} kicker={L(lang,'PRIVACIDAD','PRIVACY')} title={L(lang,'Política de Privacidad','Privacy Policy')}
        updated={L(lang,'24 de junio de 2026','June 24, 2026')}
        intro={L(lang,'En Gossip Garden tu planta habla, pero tus datos no. Aquí te explicamos de forma clara qué información recopilamos, para qué la usamos y qué control tienes sobre ella.','At Gossip Garden your plant talks, but your data doesn\'t. Here we explain clearly what information we collect, what we use it for and what control you have over it.')}
        sections={makeSections(t)}/>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
