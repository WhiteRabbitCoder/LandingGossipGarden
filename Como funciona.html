<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cómo funciona — Gossip Garden</title>
  <link rel="icon" type="image/png" href="assets/icons/icon-crayon.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: #FAF1DA;
      color: #3D2817;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      font-family: 'Quicksand', sans-serif
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .55;
      background-image: url("data:image/svg+xml,%3Csvg width='320' height='320' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='4' stitchTiles='stitch' seed='5'/%3E%3CfeColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.38 0 0 0 0 0.18 0 0 0 0.18 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .22;
      background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='2' stitchTiles='stitch' seed='12'/%3E%3CfeColorMatrix values='0 0 0 0 0.78 0 0 0 0 0.55 0 0 0 0 0.25 0 0 0 0.4 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E")
    }

    h1,
    h2,
    h3,
    h4 {
      text-shadow: .5px 0 0 currentColor, -.5px 0 0 currentColor, 0 .4px 0 currentColor, 0 -.4px 0 currentColor;
      letter-spacing: -.3px
    }

    @media(max-width:768px) {
      .gg-nav-d {
        display: none !important
      }

      .gg-nav-m {
        display: block !important
      }
    }

    @media(min-width:769px) {
      .gg-nav-m {
        display: none !important
      }
    }

    ::-webkit-scrollbar {
      width: 8px
    }

    ::-webkit-scrollbar-track {
      background: #FAF1DA
    }

    ::-webkit-scrollbar-thumb {
      background: #C68A40;
      border-radius: 4px
    }

    #root>div {
      position: relative;
      z-index: 2
    }

    @keyframes floatUp {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    @keyframes pulseRing {
      0% {
        transform: scale(1);
        opacity: .6
      }

      100% {
        transform: scale(1.45);
        opacity: 0
      }
    }

    @keyframes drawLine {
      from {
        stroke-dashoffset: 120
      }

      to {
        stroke-dashoffset: 0
      }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel" src="components/crayon-v3.jsx"></script>
  <script type="text/babel" src="components/sections-v3.jsx"></script>
  <script type="text/babel">
    const t = { hf: 'Quicksand', bf: 'Nunito' };
    const P = window.PALETTE;

    const PageNav = ({ active }) => {
      const [s, setS] = React.useState(false);
      const [o, setO] = React.useState(false);
      React.useEffect(() => {
        const h = () => setS(window.scrollY > 40);
        window.addEventListener('scroll', h, { passive: true });
        return () => window.removeEventListener('scroll', h);
      }, []);
      const links = [
        { l: 'Inicio', href: 'index.html' },
        { l: 'Cómo funciona', href: 'Como funciona.html' },
        { l: 'Personalidades', href: 'Personalidades.html' },
        { l: 'Tienda', href: 'Tienda.html' },
      ];
      return (
        <nav style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100, height: 72,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 clamp(16px,4vw,48px)',
          background: s ? 'rgba(250,241,218,0.92)' : 'rgba(250,241,218,0.6)', backdropFilter: 'blur(10px)', transition: 'all 0.3s'
        }}>
          <a href="index.html" style={{ display: 'flex', alignItems: 'center', gap: 10, textDecoration: 'none' }}>
            <img src="assets/icons/icon-crayon.png" alt="" style={{ width: 46, height: 46, objectFit: 'contain' }} />
            <span style={{ fontFamily: t.hf, fontWeight: 800, fontSize: 19, color: P.ink, lineHeight: 1, filter: 'url(#cr-text)' }}>Gossip<br />Garden</span>
          </a>
          <div className="gg-nav-d" style={{ display: 'flex', alignItems: 'center', gap: 24 }}>
            {links.map(({ l, href }) => (
              <a key={l} href={href} style={{ color: P.ink, textDecoration: 'none', fontSize: 14, fontWeight: 600, fontFamily: t.bf, position: 'relative', padding: '4px 2px' }}>
                {l}
                {l === active && <div style={{ position: 'absolute', left: 0, right: 0, bottom: -4 }}><CrayonUnderline color={P.leafDk} w="100%" h={3} /></div>}
              </a>
            ))}
            <a href="Tienda.html" style={{ textDecoration: 'none' }}><CrayonButton fill={P.heart} stroke={P.ink} color={P.cream}>Comprar</CrayonButton></a>
          </div>
          <button className="gg-nav-m" onClick={() => setO(!o)} style={{ display: 'none', background: 'none', border: 'none', fontSize: 24, cursor: 'pointer', color: P.ink }}>{o ? '×' : '≡'}</button>
          {o && <div style={{ position: 'absolute', top: 72, left: 0, right: 0, background: 'rgba(250,241,218,0.98)', padding: 24, display: 'flex', flexDirection: 'column', gap: 18, borderBottom: `2px solid ${P.ink}33` }}>
            {links.map(({ l, href }) => <a key={l} href={href} onClick={() => setO(false)} style={{ color: P.ink, textDecoration: 'none', fontSize: 18, fontWeight: 600, fontFamily: t.bf }}>{l}</a>)}
          </div>}
        </nav>
      );
    };

    /* Hand-drawn looping arrow connector — self-intersecting loop + filled hatched arrowhead */
    const StepConnector = ({ color, index = 0 }) => {
      const [on, setOn] = React.useState(false);
      const ref = React.useRef(null);
      React.useEffect(() => {
        const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setOn(true); o.disconnect(); } }, { threshold: 0.35 });
        if (ref.current) o.observe(ref.current);
        return () => o.disconnect();
      }, []);

      const isEven = index % 2 === 0;

      /*
       * Path traces: top-center → swings to one side → forms a real loop
       * (the line crosses itself) → comes back to bottom-center.
       * Tip lands at (130, 100); arrowhead drawn separately below.
       */
      const pathR =
        "M 130,4 " +
        "C 155,4  195,20  192,48 " +   // sweep right
        "C 189,76  162,82  150,68 " +   // loop top → coming back left
        "C 138,54  148,40  164,46 " +   // cross back through = creates the loop
        "C 180,52  175,74  152,84 " +   // exit loop going down
        "C 142,90  134,96  130,100";    // settle to center-bottom

      const pathL =
        "M 130,4 " +
        "C 105,4  65,20  68,48 " +
        "C 71,76  98,82  110,68 " +
        "C 122,54  112,40  96,46 " +
        "C 80,52  85,74  108,84 " +
        "C 118,90  126,96  130,100";

      const d = isEven ? pathR : pathL;

      /* Arrowhead: wide chevron pointing down, tip at (130,120), with inner notch */
      const arrowTip = "M 108,98 L 130,122 L 152,98 L 141,103 Q 130,107 119,103 Z";
      /* Three diagonal hatch lines inside the arrowhead */
      const h1 = { x1: 115, y1: 103, x2: 124, y2: 118 };
      const h2 = { x1: 127, y1: 100, x2: 133, y2: 118 };
      const h3 = { x1: 137, y1: 100, x2: 145, y2: 114 };

      return (
        <div ref={ref} style={{
          display: 'flex', justifyContent: 'center',
          margin: '-20px 0', position: 'relative', zIndex: 2, pointerEvents: 'none'
        }}>
          <svg width="260" height="130" viewBox="0 0 260 130" style={{ overflow: 'visible' }}>
            <g filter="url(#cr)">
              {/* Looping stroke — draws in when scrolled into view */}
              <path d={d}
                fill="none"
                stroke={color}
                strokeWidth="5"
                strokeLinecap="round"
                strokeLinejoin="round"
                pathLength="1"
                strokeDasharray="1"
                strokeDashoffset={on ? 0 : 1}
                style={{ transition: 'stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)' }} />

              {/* Filled arrowhead — chevron with notch */}
              <path d={arrowTip}
                fill={color}
                stroke={color}
                strokeWidth="1"
                strokeLinejoin="round"
                opacity={on ? 1 : 0}
                style={{ transition: 'opacity 0.3s ease 1.3s' }} />

              {/* Hatching lines inside arrowhead */}
              {[h1, h2, h3].map((h, i) => (
                <line key={i} x1={h.x1} y1={h.y1} x2={h.x2} y2={h.y2}
                  stroke="white" strokeWidth="2.2" strokeLinecap="round"
                  opacity={on ? 0.7 : 0}
                  style={{ transition: `opacity 0.2s ease ${1.35 + i * 0.06}s` }} />
              ))}
            </g>
          </svg>
        </div>
      );
    };

    /* Mini journey map showing all 6 steps as a horizontal path */
    const JourneyBar = ({ steps }) => {
      const [active, setActive] = React.useState(-1);
      React.useEffect(() => {
        let i = 0;
        const timer = setInterval(() => {
          setActive(prev => {
            if (prev >= steps.length - 1) { clearInterval(timer); return prev; }
            return prev + 1;
          });
          i++;
          if (i >= steps.length) clearInterval(timer);
        }, 220);
        return () => clearInterval(timer);
      }, []);

      return (
        <Reveal delay={400}>
          <div style={{ marginTop: 40, marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', gap: 0, flexWrap: 'nowrap', overflowX: 'auto', paddingBottom: 4 }}>
              {steps.map((step, i) => (
                <React.Fragment key={i}>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, minWidth: 70, flexShrink: 0 }}>
                    <div style={{ position: 'relative', width: 40, height: 40 }}>
                      {/* Pulse ring for active */}
                      {active === i && (
                        <div style={{
                          position: 'absolute', inset: -4, borderRadius: '50%', border: `2px solid ${step.color}`,
                          animation: 'pulseRing 1.2s ease-out forwards'
                        }} />
                      )}
                      <svg width="40" height="40" viewBox="0 0 40 40" style={{ position: 'absolute', inset: 0 }}>
                        <circle cx="20" cy="20" r="17"
                          fill={active >= i ? step.color : `${step.color}44`}
                          stroke={P.ink} strokeWidth="2.2"
                          filter="url(#cr)"
                          style={{ transition: 'fill 0.4s ease' }} />
                      </svg>
                      <span style={{
                        position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontFamily: t.hf, fontWeight: 900, fontSize: 16, color: P.ink,
                        opacity: active >= i ? 1 : 0.45,
                        transition: 'opacity 0.4s ease'
                      }}>{step.num}</span>
                    </div>
                    <span style={{
                      fontFamily: t.bf, fontSize: 10, fontWeight: 700, color: active >= i ? P.inkSoft : `${P.inkSoft}66`,
                      maxWidth: 66, textAlign: 'center', lineHeight: 1.25,
                      transition: 'color 0.4s ease'
                    }}>{step.shortTitle}</span>
                  </div>
                  {i < steps.length - 1 && (
                    <svg width="32" height="10" viewBox="0 0 32 10" style={{ flexShrink: 0, marginTop: 15, marginBottom: 0, opacity: active > i ? 0.7 : 0.22, transition: 'opacity 0.4s ease' }}>
                      <path d="M2,5 L26,5 M22,1 L28,5 L22,9" fill="none" stroke={P.inkSoft} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                  )}
                </React.Fragment>
              ))}
            </div>
          </div>
        </Reveal>
      );
    };

    /* Individual step card */
    const Step = ({ num, color, title, shortDesc, body, icon, flip = false, delay = 0 }) => {
      const [hov, setHov] = React.useState(false);
      return (
        <Reveal delay={delay}>
          <div
            onMouseEnter={() => setHov(true)}
            onMouseLeave={() => setHov(false)}
            style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 'clamp(24px,4vw,60px)', alignItems: 'center' }}
            className="gg-step-row">

            {/* Text side */}
            <div style={{ order: flip ? 2 : 1 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 14 }}>
                <div style={{ position: 'relative', width: 56, height: 56, flexShrink: 0 }}>
                  <svg width="56" height="56" viewBox="0 0 56 56" style={{ position: 'absolute', inset: 0 }}>
                    <circle cx="28" cy="28" r="24"
                      fill={color} stroke={P.ink} strokeWidth="2.5"
                      filter="url(#cr)"
                      style={{ transform: hov ? 'scale(1.08)' : 'scale(1)', transformOrigin: '28px 28px', transition: 'transform 0.3s ease' }} />
                  </svg>
                  <span style={{
                    position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontFamily: t.hf, fontWeight: 900, fontSize: 24, color: P.ink
                  }}>{num}</span>
                </div>
                <div>
                  <div style={{ fontFamily: t.bf, fontSize: 11, fontWeight: 700, letterSpacing: '2px', color: P.leafDk, marginBottom: 3, textTransform: 'uppercase' }}>{shortDesc}</div>
                  <h3 style={{ fontFamily: t.hf, fontWeight: 800, fontSize: 'clamp(20px,2.4vw,28px)', color: P.ink, lineHeight: 1.1 }}>{title}</h3>
                </div>
              </div>
              <p style={{ fontFamily: t.bf, fontSize: 'clamp(14px,1.35vw,16px)', color: P.inkSoft, lineHeight: 1.7, paddingLeft: 70 }}>{body}</p>
            </div>

            {/* Icon card side */}
            <div style={{ order: flip ? 1 : 2, display: 'flex', justifyContent: 'center' }}>
              <div style={{
                transform: hov ? 'translateY(-6px) rotate(0.5deg)' : 'translateY(0)',
                transition: 'transform 0.35s cubic-bezier(.4,0,.2,1)',
                width: '100%', maxWidth: 340
              }}>
                <CrayonCard fill={`${color}45`} stroke={P.ink} sw={2.5} radius={28} padding={36} style={{ textAlign: 'center' }}>
                  <svg width="108" height="108" viewBox="0 0 100 100" style={{ filter: 'url(#cr)', margin: '0 auto', display: 'block' }}>
                    {icon}
                  </svg>
                </CrayonCard>
              </div>
            </div>
          </div>
        </Reveal>
      );
    };

    const HowItWorks = () => {
      const steps = [
        {
          num: '1', color: P.leaf, flip: false,
          shortTitle: 'Pedir',
          shortDesc: 'Paso 1 — El comienzo',
          title: 'Pide tu maceta',
          body: 'Elige el color de tu maceta y la personalidad de tu futura planta amiga. La recibes en casa con sensores integrados, sustrato y semilla incluidos — todo lo que necesitas para empezar.',
          icon: <>
            <rect x="18" y="28" width="64" height="50" rx="7" fill={`${P.leaf}30`} stroke={P.ink} strokeWidth="3" />
            <path d="M33,28 L33,20 Q33,13 50,13 Q67,13 67,20 L67,28" fill="none" stroke={P.ink} strokeWidth="3" strokeLinecap="round" />
            <path d="M36,54 L45,63 L64,42" stroke={P.leafDk} strokeWidth="4" fill="none" strokeLinecap="round" strokeLinejoin="round" />
            <path d="M22,62 L22,72 L78,72 L78,62" fill="none" stroke={P.ink} strokeWidth="2" strokeDasharray="4,3" strokeLinecap="round" opacity="0.5" />
          </>
        },
        {
          num: '2', color: P.pot, flip: true,
          shortTitle: 'Conectar',
          shortDesc: 'Paso 2 — Bienvenida a casa',
          title: 'Conecta por Wi-Fi',
          body: 'Descarga la app, escanea el código de la caja y tu maceta se une a tu red en menos de dos minutos. Sin pasos raros — solo escanear, conectar y listo.',
          icon: <>
            <circle cx="50" cy="72" r="7" fill={P.pot} stroke={P.ink} strokeWidth="3" />
            <path d="M30,56 Q50,42 70,56" fill="none" stroke={P.ink} strokeWidth="3.5" strokeLinecap="round" />
            <path d="M18,44 Q50,22 82,44" fill="none" stroke={P.ink} strokeWidth="3" strokeLinecap="round" opacity=".6" />
            <path d="M8,33 Q50,6 92,33" fill="none" stroke={P.ink} strokeWidth="2.5" strokeLinecap="round" opacity=".3" />
            <circle cx="50" cy="72" r="13" fill="none" stroke={P.pot} strokeWidth="1.5" opacity="0.4" />
          </>
        },
        {
          num: '3', color: P.heart, flip: false,
          shortTitle: 'Bautizar',
          shortDesc: 'Paso 3 — Nace la amistad',
          title: 'Bautiza a tu planta',
          body: 'Ponle nombre. Elige su personalidad: ¿Alegre, Dormilona, Dramática o Exigente? Así nace su carácter — el tono que usará para escribirte desde ahora.',
          icon: <>
            <circle cx="50" cy="40" r="22" fill={`${P.heart}25`} stroke={P.ink} strokeWidth="2.5" />
            <path d="M40,38 Q42,42 44,38" stroke={P.ink} strokeWidth="2.5" fill="none" strokeLinecap="round" />
            <path d="M56,38 Q58,42 60,38" stroke={P.ink} strokeWidth="2.5" fill="none" strokeLinecap="round" />
            <path d="M43,50 Q50,56 57,50" stroke={P.heart} strokeWidth="3" fill="none" strokeLinecap="round" />
            <ellipse cx="40" cy="46" rx="3" ry="2" fill={P.heart} opacity="0.35" />
            <ellipse cx="60" cy="46" rx="3" ry="2" fill={P.heart} opacity="0.35" />
            <path d="M40,70 L50,62 L60,70" fill={P.cream} stroke={P.ink} strokeWidth="2.5" strokeLinejoin="round" />
            <rect x="28" y="70" width="44" height="16" rx="5" fill={P.cream} stroke={P.ink} strokeWidth="2.5" />
            <text x="50" y="82" textAnchor="middle" fontFamily="Quicksand" fontWeight="800" fontSize="9.5" fill={P.heart}>Alegre</text>
          </>
        },
        {
          num: '4', color: '#B8C9E8', flip: true,
          shortTitle: 'Charla',
          shortDesc: 'Paso 4 — La magia empieza',
          title: 'Ella te habla primero',
          body: 'Cuando tiene sed, frío, demasiado sol — o simplemente ganas de charlar — te manda un mensaje. Tú no abres la app: es ella la que inicia la conversación, con su voz y su carácter.',
          icon: <>
            <rect x="14" y="18" width="68" height="46" rx="9" fill={P.cream} stroke={P.ink} strokeWidth="2.5" />
            <path d="M24,64 L20,80 L42,64" fill={P.cream} stroke={P.ink} strokeWidth="2.5" strokeLinejoin="round" />
            <line x1="26" y1="33" x2="54" y2="33" stroke={P.ink} strokeWidth="2.5" strokeLinecap="round" />
            <line x1="26" y1="43" x2="68" y2="43" stroke={P.ink} strokeWidth="2" strokeLinecap="round" opacity=".45" />
            <line x1="26" y1="52" x2="46" y2="52" stroke={P.ink} strokeWidth="2" strokeLinecap="round" opacity=".25" />
            <circle cx="74" cy="24" r="8" fill={P.heart} stroke={P.ink} strokeWidth="2" />
            <line x1="70" y1="24" x2="78" y2="24" stroke={P.cream} strokeWidth="2" strokeLinecap="round" />
            <line x1="74" y1="20" x2="74" y2="28" stroke={P.cream} strokeWidth="2" strokeLinecap="round" />
          </>
        },
        {
          num: '5', color: P.leafDk, flip: false,
          shortTitle: 'Sensores',
          shortDesc: 'Paso 5 — Siempre alerta',
          title: 'Cuatro sensores, todo el tiempo',
          body: 'Humedad del suelo, temperatura, luz y humedad del aire — medidos cada minuto. Tu planta aprende qué condiciones la hacen feliz y afina sus mensajes con el tiempo.',
          icon: <>
            <rect x="32" y="10" width="36" height="72" rx="9" fill={`${P.leafDk}20`} stroke={P.ink} strokeWidth="2.5" />
            <circle cx="50" cy="28" r="9" fill={`#9DC8E8`} stroke={P.ink} strokeWidth="2.2" />
            <circle cx="50" cy="48" r="9" fill={`${P.pot}90`} stroke={P.ink} strokeWidth="2.2" />
            <circle cx="50" cy="66" r="6" fill={P.heart} stroke={P.ink} strokeWidth="2" />
            <text x="50" y="32" textAnchor="middle" fontFamily="Quicksand" fontWeight="700" fontSize="8" fill={P.ink}>hum</text>
            <text x="50" y="52" textAnchor="middle" fontFamily="Quicksand" fontWeight="700" fontSize="8" fill={P.ink}>temp</text>
            <text x="50" y="70" textAnchor="middle" fontFamily="Quicksand" fontWeight="700" fontSize="7" fill={P.cream}>luz</text>
            <path d="M50,4 L50,10 M44,10 L56,10" stroke={P.ink} strokeWidth="2" strokeLinecap="round" />
            <path d="M14,40 Q18,28 26,32" fill="none" stroke={P.leaf} strokeWidth="2" strokeLinecap="round" opacity="0.6" />
            <path d="M86,40 Q82,28 74,32" fill="none" stroke={P.leaf} strokeWidth="2" strokeLinecap="round" opacity="0.6" />
          </>
        },
        {
          num: '6', color: P.cream, flip: true,
          shortTitle: 'Informe',
          shortDesc: 'Paso 6 — Su historia',
          title: 'Su historia, tu informe',
          body: 'Cada mes recibes un resumen ilustrado de cómo vivió tu planta: sus días más felices, cuándo tuvo sed, si le faltó luz. Un diario que crece contigo.',
          icon: <>
            <rect x="18" y="12" width="64" height="76" rx="7" fill={P.cream} stroke={P.ink} strokeWidth="2.5" />
            <line x1="30" y1="28" x2="70" y2="28" stroke={P.ink} strokeWidth="2" strokeLinecap="round" opacity=".4" />
            <path d="M30,42 L40,54 L52,42 L64,50 L72,44" fill="none" stroke={P.leafDk} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
            <circle cx="40" cy="54" r="3.5" fill={P.leaf} stroke={P.ink} strokeWidth="1.5" />
            <circle cx="52" cy="42" r="3.5" fill={P.pot} stroke={P.ink} strokeWidth="1.5" />
            <circle cx="64" cy="50" r="3.5" fill={P.heart} stroke={P.ink} strokeWidth="1.5" />
            <line x1="30" y1="68" x2="55" y2="68" stroke={P.ink} strokeWidth="2" strokeLinecap="round" opacity=".4" />
            <line x1="30" y1="77" x2="66" y2="77" stroke={P.ink} strokeWidth="1.5" strokeLinecap="round" opacity=".25" />
          </>
        },
      ];

      const connectorColors = [P.leaf, P.pot, P.heart, '#B8C9E8', P.leafDk];

      return (
        <section style={{ padding: '20px clamp(20px,5vw,80px) 80px', maxWidth: 1080, margin: '0 auto' }}>
          <style>{`
            @media(max-width:700px){
              .gg-step-row{grid-template-columns:1fr!important}
              .gg-step-row>div{order:unset!important}
            }
            @keyframes pulseRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
          `}</style>

          <JourneyBar steps={steps} />

          <div style={{ marginTop: 56 }}>
            {steps.map((s, i) => (
              <React.Fragment key={i}>
                <Step {...s} delay={0} />
                {i < steps.length - 1 && (
                  <StepConnector color={connectorColors[i]} index={i} />
                )}
              </React.Fragment>
            ))}
          </div>
        </section>
      );
    };

    const App = () => (
      <div style={{ fontFamily: t.bf, position: 'relative' }}>
        <CrayonDefs />
        <PageNav active="Cómo funciona" />

        {/* Hero */}
        <section style={{ padding: '120px clamp(20px,5vw,80px) 40px', textAlign: 'center' }}>

            <p style={{ fontFamily: t.bf, fontSize: 'clamp(15px,1.5vw,18px)', color: P.inkSoft, marginTop: 20, maxWidth: 520, marginLeft: 'auto', marginRight: 'auto', lineHeight: 1.6 }}>
              En seis pasos sencillos, tu semilla germina, crece y empieza a hablarte.

          <Reveal delay={200}>
            <div style={{ display: 'flex', justifyContent: 'center', marginTop: 48 }}>
              <div style={{ position: 'relative', width: 360, height: 360 }}>

                  <circle cx="180" cy="180" r="174" fill={`${P.leaf}28`} stroke={P.ink} strokeWidth="3" filter="url(#cr)" />

                <img src="assets/materas/verde.png" alt="Alegre" style={{
                  position: 'absolute', bottom: 0, left: 'calc(50% - 190px)', transform: 'translateX(-50%)',
                  height: 420, width: 'auto', objectFit: 'contain',
                  filter: 'drop-shadow(0 8px 22px rgba(61,40,23,0.18))',
                  animation: 'floatUp 5s ease-in-out infinite',

                {/* Decorative stars around the plant */}
                <svg style={{ position: 'absolute', top: '10%', right: '8%', overflow: 'visible' }} width="24" height="24" viewBox="0 0 24 24">
                  <path d="M12,2 L13.5,9 L20,12 L13.5,15 L12,22 L10.5,15 L4,12 L10.5,9 Z" fill={P.pot} stroke={P.ink} strokeWidth="1.5" filter="url(#cr)" />
                </svg>
                <svg style={{ position: 'absolute', top: '20%', left: '6%', overflow: 'visible' }} width="18" height="18" viewBox="0 0 24 24">
                  <path d="M12,2 L13.5,9 L20,12 L13.5,15 L12,22 L10.5,15 L4,12 L10.5,9 Z" fill={P.heart} stroke={P.ink} strokeWidth="1.5" filter="url(#cr)" />
                </svg>
              </div>
            </div>
          </Reveal>
        </section>

        {/* Steps */}
        <HowItWorks />

        {/* CTA */}

          <Reveal>
            <CrayonCard fill={`${P.heart}25`} stroke={P.ink} sw={3} radius={28} padding={40} style={{ maxWidth: 680, margin: '0 auto' }}>
              <div style={{ fontFamily: t.bf, fontSize: 13, fontWeight: 700, letterSpacing: '2px', color: P.heart, marginBottom: 10 }}>¿LISTA?</div>
              <h2 style={{ fontFamily: t.hf, fontSize: 'clamp(26px,3.5vw,40px)', fontWeight: 800, color: P.ink, marginBottom: 8 }}>Conoce a tu próxima amiga.</h2>
              <div style={{ display: 'flex', justifyContent: 'center' }}>
